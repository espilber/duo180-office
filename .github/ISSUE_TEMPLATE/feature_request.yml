name: Petición de función
description: Propón una capacidad nueva o una mejora
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: Aplicación
      options:
        - duo180 Docs (docs)
        - duo180 Sheets (sheets)
        - duo180 Slides (slides)
        - duo180 PDF (pdf)
        - duo180 Markdown (markdown)
        - duo180 HTML (html)
        - Contenedor / pantalla de inicio
        - Toda la suite
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué intentas hacer que hoy resulta difícil o imposible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solución propuesta
      description: ¿Cómo te gustaría que funcionara? También son bienvenidas las alternativas que hayas considerado.
    validations:
      required: true
