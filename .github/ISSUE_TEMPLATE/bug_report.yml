name: Informe de error
description: Algo no funciona o se comporta de forma inesperada
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: Aplicación
      description: ¿Qué parte de la suite está afectada?
      options:
        - duo180 Docs (docs)
        - duo180 Sheets (sheets)
        - duo180 Slides (slides)
        - duo180 PDF (pdf)
        - duo180 Markdown (markdown)
        - duo180 HTML (html)
        - Contenedor / pantalla de inicio
        - Compilación / empaquetado
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión y sistema
      description: Versión de la app (o commit) y sistema operativo
      placeholder: '0.1.0 en Windows 11 / macOS 15.3 / Ubuntu 24.04'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: ¿Qué ha pasado?
      description: >
        ¿Qué hiciste, qué esperabas que ocurriera y qué ocurrió en realidad?
        Si el error lo provoca un documento, adjunta un archivo de ejemplo
        mínimo si es posible (elimina antes cualquier contenido confidencial).
      placeholder: Pasos para reproducirlo, comportamiento esperado, comportamiento real.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros / capturas
      description: Salida de consola, trazas de error o capturas de pantalla, si los tienes.
    validations:
      required: false
